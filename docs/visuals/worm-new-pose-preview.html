<!doctype html><meta charset="utf-8"><title>New worm poses</title>
<style>body{margin:0;background:#20334a;color:white;font:16px system-ui}h1{margin:16px 22px 4px;font-size:25px}p{margin:0 22px 16px;color:#c9d9e8}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 18px 18px}.card{overflow:hidden;border-radius:12px;background:linear-gradient(#86cbee 0 78%,#a27443 78%)}.label{padding:9px 13px;background:#132338;font-weight:700}canvas{display:block;width:100%}</style>
<h1>New worm pose and hat fit</h1><p>Browser approximation using the Unity crop and painted head anchor.</p><div id="grid"></div>
<script>
const frames=[['Gun recoil','worm-red-fire.png',0],['Place dynamite','worm-red-place.png',.10],['Call strike','worm-red-call.png',0],['Drown','worm-red-drown.png',0],['Walk B','worm-red-walk-b.png',.05],['Airborne','worm-red-airborne.png',0]];
const root='../../client/Assets/Resources/';const hat=new Image();hat.src=root+'Cosmetics/coastal-brown-hat.png';
hat.onload=()=>frames.forEach(([label,file,headShift])=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="label">'+label+'</div>';const canvas=document.createElement('canvas');canvas.width=430;canvas.height=345;card.append(canvas);document.getElementById('grid').append(card);const img=new Image();img.onload=()=>{const c=canvas.getContext('2d'),scale=210,ox=215,oy=252;let footOffset=file.includes('walk-b')?-.10:0;c.drawImage(img,50,60,1200,1140,ox-.72*scale,oy-1.20*scale-footOffset*scale,1.44*scale,1.65*scale);const hx=.24+headShift,hy=.635+(file.includes('walk-b')?-.15:0),r=.46,x=-.12,y=.85,w=1.80,h=1.27;c.drawImage(hat,ox+(hx+r*(x-w/2))*scale,oy-(hy+r*(y+h/2))*scale,r*w*scale,r*h*scale)};img.src=root+'Characters/'+file});
</script>
