<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Waiting screen layout preview</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: black; }
  img { position: absolute; }
</style>
<img id="scene" alt="Waiting scene">
<img id="start" alt="Tap to start">
<script>
const resources = '../../client/Assets/Resources/Waiting/';
const params = new URLSearchParams(location.search);
const theme = params.get('theme') === 'neon' ? 'Neon' : 'Coastal';
const viewportHeight = Number(params.get('height')) || innerHeight;
const scene = document.getElementById('scene');
const start = document.getElementById('start');
scene.src = resources + theme + '/scene.png';
start.src = resources + theme + '/start.png';
scene.onload = () => {
  const scale = Math.min(innerWidth / scene.naturalWidth, viewportHeight / scene.naturalHeight);
  const w = scene.naturalWidth * scale, h = scene.naturalHeight * scale;
  const x = (innerWidth - w) / 2, y = (viewportHeight - h) / 2;
  Object.assign(scene.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
  Object.assign(start.style, {left: x + w * .325 + 'px', top: y + h * .815 + 'px',
    width: w * .35 + 'px', height: h * .145 + 'px', objectFit: 'contain', cursor: 'pointer'});
};
</script>
</html>
